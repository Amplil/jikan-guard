<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ドパガキガード</title>
  <link rel="stylesheet" href="ui.css">
  <script src="popup.js" defer></script>
</head>
<body class="popup-page">
  <main class="popup-main">
    <header class="brand-header">
      <img class="brand-mark" src="icons/128.png" alt="">
      <div><p class="eyebrow">ドパガキに待ったを</p><h1>ドパガキガード</h1></div>
      <button id="open-options" class="icon-button" type="button" aria-label="設定を開く" title="設定を開く">⚙</button>
    </header>
    <section class="today-heading">
      <div><p class="eyebrow">今日の利用状況</p><h2>今日の、のこり時間</h2></div>
      <span id="today" class="date-label"></span>
    </section>
    <section id="budget-hero" class="budget-hero">
      <div class="remaining-line"><strong id="remaining">—</strong><span>のこり</span></div>
      <div id="budget-track" class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="今日の合計使用時間"><div id="budget-fill" class="progress-fill" style="width:0"></div></div>
      <p id="budget-meta" class="budget-meta"></p>
    </section>
    <p id="popup-status" class="status-message" role="status" aria-live="polite">利用状況を読み込んでいます…</p>
    <div id="site-list" class="site-list" aria-label="サイトごとの使用時間"></div>
    <div id="empty-state" class="empty-state" hidden><p class="empty-symbol" aria-hidden="true">◷</p><h2>見すぎる前に、上限を決めよう</h2><p>設定から、時間を数えたいサイトを追加できます</p></div>
    <footer class="popup-footer"><span class="privacy-dot" aria-hidden="true"></span><span>この端末だけに記録 · 毎日0時にリセット</span></footer>
  </main>
</body>
</html>
